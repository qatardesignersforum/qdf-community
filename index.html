<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qatar Designers Forum – QDF</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAFA;--ink:#1E1E1E;--mut:#5A5A5A;--card:#fff;--line:#E2E0DA;--acc:#F5AC1F;--acc-ink:#1E1E1E;--ok:#6B4300;--okbg:#FDE9B0;--warn:#F5AC1F}
.hero2{background:var(--ink);color:#fff;border-radius:22px;padding:32px;display:flex;gap:28px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.hero2 h1{font-size:clamp(34px,6vw,56px);font-weight:800;letter-spacing:-.02em;color:var(--acc);max-width:12ch}
.hero2 p{color:#E8E8E8;max-width:46ch;margin:12px 0 0}
.hero2 img{width:180px;background:#fff;border-radius:22px;padding:14px}
.hero2 .btn.o{color:#fff;border-color:#777}
.hero2 :focus-visible{outline-color:#fff}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.two ul{padding-left:18px;margin:8px 0 0}
.tl{border-left:3px solid var(--ink);margin-left:6px;padding-left:22px;display:grid;gap:20px}
.ti{position:relative}
.ti::before{content:'';position:absolute;left:-32px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--acc);border:3px solid var(--ink)}
.ti.up::before{background:#fff;border-style:dashed}
.ti time{font-weight:700;color:#8A5A00;font-size:14px}
.ti h3{font-size:18px}
footer{background:var(--ink);color:#ddd;text-align:center;padding:18px 16px;font-size:14px}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:4px solid var(--acc);display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font:800 20px 'Bricolage Grotesque',sans-serif;margin-right:auto}
.logo img{height:54px;width:auto;display:block}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 12px;border-radius:99px;font-weight:500}
nav button[aria-current=page]{background:var(--ink);color:var(--acc)}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:9px 16px;font-weight:700}
.btn.o{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.s{padding:5px 10px;font-size:14px}
.btn.d{background:#D93B3B;color:#fff}
main{max-width:1060px;margin:0 auto;padding:24px 16px 60px}
.hero{padding:28px 0 20px}
.hero h1{font-size:clamp(34px,7vw,64px);font-weight:800;letter-spacing:-.03em;max-width:14ch}
.hero p{color:var(--mut);max-width:52ch;margin:12px 0 0}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
input,select,textarea{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.bar input{flex:1 1 220px;width:auto}.bar select{width:auto}
.chk{display:flex;align-items:center;gap:8px;white-space:nowrap}.chk input{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.dc{display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;width:100%}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font:800 22px 'Bricolage Grotesque';color:#fff;flex:none}
.row{display:flex;gap:12px;align-items:center}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--okbg);color:var(--ok)}
.tag.n{background:var(--line);color:var(--mut)}
.mut{color:var(--mut);font-size:14px}
.stars button{background:none;border:0;font-size:22px;padding:0 1px;color:var(--line)}
.stars button.on{color:#F5A400}
.pf{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media(max-width:760px){.pf{grid-template-columns:1fr}}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.works div{aspect-ratio:4/3;border-radius:12px;overflow:hidden;display:grid;place-items:center;color:#fff;font:700 14px 'Bricolage Grotesque'}
.works img{width:100%;height:100%;object-fit:cover}
.form{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.form .f{grid-column:1/-1}
@media(max-width:600px){.form{grid-template-columns:1fr}}
label{font-size:14px;font-weight:700;display:block;margin-bottom:4px}
.post{border-top:1px solid var(--line);padding:14px 0}
.post:first-child{border-top:0}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.stats .card{flex:1 1 140px}.stats b{font:800 30px 'Bricolage Grotesque';display:block}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--ink);padding:22px;width:min(380px,92vw)}
dialog::backdrop{background:#0008}
.note{background:var(--warn);color:#15171C;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:16px}
</style>
</head>
<body>
<header>
  <div class="logo"><img id="lg" alt="Qatar Designers Forum - QDF logo"></div>
  <nav id="nav"></nav>
  <span id="auth"></span>
</header>
<main id="app"></main>
<footer>Qatar Designers Forum (QDF). A WhatsApp community group since 2017.</footer>

<dialog id="dlg">
  <h2>Log in</h2>
  <p class="mut">Demo only. Real login comes when you connect the database (see notes).</p>
  <div style="display:grid;gap:8px;margin-top:12px">
    <button class="btn" data-login="2">Log in as designer (Aisha)</button>
    <button class="btn o" data-login="admin">Log in as admin</button>
    <button class="btn o" data-close>Cancel</button>
  </div>
</dialog>

 <h2 style="margin:32px 0 16px">Our journey</h2>
 <div class="tl">${ev.map(([d,t,x])=>`<div class="ti"><time>${d}</time><h3>${t}</h3><p class="mut" style="margin:2px 0 0">${x}</p></div>`).join('')}
 <div class="ti up"><time>Coming soon</time><h3>6th Meetup</h3><p class="mut" style="margin:2px 0 0">More workshops, learning and collaboration. The journey continues.</p></div></div>`;
}
function dir(){
 const L=D.filter(d=>!d.pending&&(!F.free||d.free)&&(d.name+d.role+d.area).toLowerCase().includes(F.q.toLowerCase()));
 return `<h2 style="margin-bottom:6px">QDF designers</h2><p class="mut">Browse portfolios, follow designers whose work you like, and find someone free for your next project.</p>
 <div class="bar"><input id="q" placeholder="Search name, skill or area" value="${esc(F.q)}" aria-label="Search"><label class="chk"><input type="checkbox" id="fr" ${F.free?'checked':''}> Free for freelance</label></div>
 <div class="grid">${L.map(d=>`<button class="card dc" data-p="${d.id}"><div class="row">${avatar(d)}<div><h3>${esc(d.name)}</h3><div class="mut">${esc(d.role)}</div></div></div>
 <div class="mut">${esc(d.job)} · ${esc(d.area)}</div>
 <div class="row" style="justify-content:space-between"><span class="tag ${d.free?'':'n'}">${d.free?'Available':'Not available'}</span><span class="mut">★ ${avg(d.rates)} · ${d.followers} followers</span></div></button>`).join('')||'<p class="mut">No designers match. Clear the search or the freelance filter.</p>'}</div>`;
}
function profile(d){
 const fol=mine['f'+d.id],star=mine['r'+d.id]||0;
 return `<button class="btn o s" data-v="dir">Back to designers</button>
 <div class="pf" style="margin-top:14px"><div class="card"><div class="row">${avatar(d,84)}<div><h2>${esc(d.name)}</h2><div class="mut">${esc(d.role)}</div></div></div>
 <p>${esc(d.bio)}</p><p class="mut">${esc(d.job)}<br>${esc(d.area)}</p><span class="tag ${d.free?'':'n'}">${d.free?'Available for freelance':'Not taking freelance work'}</span>
 <div style="display:grid;gap:8px;margin-top:14px">
 <a class="btn" style="text-align:center;text-decoration:none" href="https://wa.me/${d.wa.replace(/\D/g,'')}" target="_blank" rel="noopener">Message on WhatsApp</a>
 <a class="btn o" style="text-align:center;text-decoration:none" href="mailto:${esc(d.email)}">Email</a>
 ${d.cv?`<a class="btn o" style="text-align:center;text-decoration:none" href="${d.cv}" download="CV-${esc(d.name)}">Download CV</a>`:'<span class="mut">No CV uploaded yet</span>'}
 <button class="btn ${fol?'o':''}" data-follow="${d.id}">${fol?'Following':'Follow'} (${d.followers})</button></div></div>
 <div class="card"><h3>Portfolio</h3><div class="row" style="margin:8px 0"><span class="mut">Rating ★ ${avg(d.rates)} (${d.rates.length})</span>
 <span class="stars" aria-label="Rate this portfolio">${[1,2,3,4,5].map(n=>`<button data-rate="${d.id}:${n}" class="${n<=star?'on':''}" aria-label="${n} stars">★</button>`).join('')}</span></div>
 <div class="works">${d.works.map((w,i)=>w.startsWith('data:')?`<div><img src="${w}" alt="Work"></div>`:`<div style="background:${C[(d.id+i)%6]}">${esc(w)}</div>`).join('')||'<p class="mut">No work uploaded yet.</p>'}</div></div></div>`;
}
function disc(){
 return `<h2 style="margin-bottom:14px">Discussion</h2>
 <div class="card" style="margin-bottom:16px">${me?`<label for="nt">Start a topic</label><textarea id="nt" rows="2" placeholder="Ask a question or share an idea"></textarea><button class="btn" style="margin-top:8px" id="np">Post topic</button>`:'<p class="mut">Log in to post and reply.</p>'}</div>
 <div class="card">${posts.map((p,i)=>`<div class="post"><b>${esc(p.u)}</b> <span class="mut">${p.d}</span><p style="margin:4px 0">${esc(p.t)}</p>
 ${p.r.map(r=>`<div class="mut" style="padding-left:14px;border-left:3px solid var(--line);margin:6px 0">${esc(r)}</div>`).join('')}
 ${me?`<div class="row" style="margin-top:6px"><input data-ri="${i}" placeholder="Reply" aria-label="Reply"><button class="btn s" data-rp="${i}">Reply</button></div>`:''}</div>`).join('')}</div>`;
}
function edit(){
 const d=D.find(x=>x.id===me);
 const f=(k,l,t)=>`<div><label for="e${k}">${l}</label><input id="e${k}" data-k="${k}" type="${t||'text'}" value="${esc(d[k])}"></div>`;
 return `<h2 style="margin-bottom:14px">My profile</h2><div class="card"><div class="form">
 ${f('name','Full name')}${f('role','What you do')}${f('job','Place of work')}${f('area','Accommodation area')}${f('wa','WhatsApp number (with country code)','tel')}${f('email','Email','email')}
 <div class="f"><label for="ebio">Short bio</label><textarea id="ebio" data-k="bio" rows="2">${esc(d.bio)}</textarea></div>
 <div class="f"><label class="chk"><input type="checkbox" data-k="free" ${d.free?'checked':''}> I am available for freelance work</label></div>
 <div><label for="up">Profile photo</label><input id="up" type="file" accept="image/*" data-file="photo"></div>
 <div><label for="uc">CV (PDF)</label><input id="uc" type="file" accept=".pdf" data-file="cv"></div>
 <div class="f"><label for="uw">Add portfolio images</label><input id="uw" type="file" accept="image/*" multiple data-file="works"></div></div>
 <div class="row" style="margin-top:14px"><button class="btn" data-v="dir" id="sv">Save and view directory</button></div>
 ${d.pending?'<p class="mut">Your profile is waiting for admin approval before it appears in the directory.</p>':''}</div>`;
}
function adm(){
 return `<h2 style="margin-bottom:14px">Admin</h2>
 <div class="stats"><div class="card"><b>${D.length}</b>Members</div><div class="card"><b>${D.filter(d=>d.free).length}</b>Free for freelance</div><div class="card"><b>${D.filter(d=>d.pending).length}</b>Awaiting approval</div><div class="card"><b>${posts.length}</b>Topics</div></div>
 <div class="card scroll"><table><tr><th>Name</th><th>Role</th><th>WhatsApp</th><th>Status</th><th></th></tr>
 ${D.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.role)}</td><td>${esc(d.wa)}</td><td>${d.pending?'Pending':'Live'}</td>
 <td style="white-space:nowrap">${d.pending?`<button class="btn s" data-ap="${d.id}">Approve</button> `:''}<button class="btn s o" data-p="${d.id}">View</button> <button class="btn s d" data-rm="${d.id}">Remove</button></td></tr>`).join('')}</table></div>
 <div class="card" style="margin-top:16px"><h3>Community logo</h3><p class="mut">Change the logo shown on this page (preview only).</p><input type="file" accept="image/*" id="lgf"></div>`;
}
const rd=(f,cb)=>{const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)};
document.addEventListener('click',e=>{
 const t=e.target.closest('button,a');if(!t)return;const q=k=>t.dataset[k];
 if(q('v')){view=q('v');sel=null;return render()}
 if(q('p')){sel=+q('p');return render()}
 if(t.id==='in')return $('#dlg').showModal();
 if(t.id==='out'){me=null;return go('dir')}
 if('close' in t.dataset)return $('#dlg').close();
 if(q('login')){me=q('login')==='admin'?'admin':+q('login');$('#dlg').close();return go(me==='admin'?'adm':'me')}
 if(q('follow')){if(!me)return $('#dlg').showModal();const d=D.find(x=>x.id==q('follow')),k='f'+d.id;mine[k]=!mine[k];d.followers+=mine[k]?1:-1;return render()}
 if(q('rate')){if(!me)return $('#dlg').showModal();const[i,n]=q('rate').split(':');const d=D.find(x=>x.id==i);if(mine['r'+i])d.rates.splice(d.rates.lastIndexOf(mine['r'+i]),1);mine['r'+i]=+n;d.rates.push(+n);return render()}
 if(t.id==='np'){const v=$('#nt').value.trim();if(v){posts.unshift({u:D.find(x=>x.id===me)?.name||'Admin',t:v,r:[],d:'Just now'});render()}return}
 if(q('rp')){const i=$(`[data-ri="${q('rp')}"]`);if(i.value.trim()){posts[q('rp')].r.push(i.value.trim()+' ('+(D.find(x=>x.id===me)?.name||'Admin')+')');render()}return}
 if(q('ap')){D.find(x=>x.id==q('ap')).pending=false;return render()}
 if(q('rm')){if(confirm('Remove this member?')){D=D.filter(x=>x.id!=q('rm'));render()}return}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='q'){F.q=t.value;const p=t.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}
 if(t.id==='fr'){F.free=t.checked;render()}
 if(t.dataset.k){const d=D.find(x=>x.id===me);d[t.dataset.k]=t.type==='checkbox'?t.checked:t.value}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='lgf'&&t.files[0])rd(t.files[0],u=>{LOGO=u;$('#lg').src=u;render()});
 if(t.dataset.file&&t.files.length){const d=D.find(x=>x.id===me),k=t.dataset.file;
  [...t.files].forEach(f=>rd(f,u=>{if(k==='works')d.works.push(u);else d[k]=u}))}
});
$('#lg').src=LOGO;render();
</script>
</body>
</html>
